name: Deploy Firebase

# Deploys Cloud Functions, Firestore rules and indexes, and the Hosting pages
# (privacy policy, account deletion) to accounts-note-4ae3d when they change
# on master, after the tests pass. Can also be run by hand from the Actions tab.
#
# Secrets (Settings → Secrets and variables → Actions); see README "CI/CD":
#   FIREBASE_SERVICE_ACCOUNT_JSON  deployer service account key
#   FIREBASE_JSON_BASE64           firebase.json (git-ignored)
#   FUNCTIONS_ENV_BASE64           functions/.env.accounts-note-4ae3d
on:
  push:
    branches: [master]
    paths:
      - functions/**
      - firestore.rules
      - firestore.indexes.json
      - hosting/**
  workflow_dispatch:

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: accounts-note-4ae3d

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: firebase-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Restore config and credentials
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_JSON_BASE64: ${{ secrets.FIREBASE_JSON_BASE64 }}
          FUNCTIONS_ENV_BASE64: ${{ secrets.FUNCTIONS_ENV_BASE64 }}
        run: |
          for v in SERVICE_ACCOUNT_JSON FIREBASE_JSON_BASE64 FUNCTIONS_ENV_BASE64; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/deployer.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/deployer.json" >> "$GITHUB_ENV"
          echo "$FIREBASE_JSON_BASE64" | base64 -d > firebase.json
          echo "$FUNCTIONS_ENV_BASE64" | base64 -d > "functions/.env.$FIREBASE_PROJECT"

      - name: Install function dependencies
        run: npm ci --prefix functions

      # The functions predeploy hook in firebase.json builds the TypeScript.
      - name: Deploy
        run: >
          npx --yes firebase-tools@15.35.0 deploy
          --only functions,firestore,hosting
          --project "$FIREBASE_PROJECT"
          --non-interactive --force

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deployer.json"
