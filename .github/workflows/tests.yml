name: Tests

# Runs the regression suite on every push and pull request, so a change that
# breaks existing behaviour is caught before review rather than on a device.
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      # lib/firebase_options.dart is git-ignored; analysis and unit tests
      # only need something with the same shape.
      - name: Use placeholder Firebase options
        run: cp ci/firebase_options.stub.dart lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  backend:
    name: Functions and Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            rules_test/package-lock.json

      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci --prefix functions
          npm ci --prefix rules_test

      - name: Lint and build functions
        run: |
          npm --prefix functions run lint
          npm --prefix functions run build

      # firebase.json is git-ignored; the emulator only needs the rules.
      - name: Emulator config
        run: cp ci/firebase.emulator.json firebase.json

      - name: Functions and rules tests (Firestore emulator)
        run: >
          npx --yes firebase-tools@15.35.0 emulators:exec
          --only firestore --project demo-accounts-note
          "node --test functions/test/*.test.mjs && npm --prefix rules_test test"
